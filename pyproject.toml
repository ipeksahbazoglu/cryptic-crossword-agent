[project]
name = "cryptic-agent"
version = "0.1.0"
description = "A tool-using LLM agent for solving UK cryptic crossword clues"
authors = [
    { name = "ipeksahbazoglu", email = "ipeksahbazoglu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.125.0",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "nltk>=3.9.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tqdm>=4.70.1",
]

[project.scripts]
cryptic-agent = "cryptic_agent.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# E/F = pyflakes+pycodestyle core, I = import sorting, UP = pyupgrade,
# B = bugbear (common bug patterns), SIM = simplify, N = naming conventions

[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
