name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Reads .python-version, installs that Python.
      - run: uv python install

      # --locked: fail if uv.lock is out of date with pyproject.toml,
      # instead of silently resolving new versions.
      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src tests

      # Word list for the tools' integration tests (they skip without it).
      - name: Download NLTK corpus
        run: uv run python -c "import nltk; assert nltk.download('words', quiet=True)"

      - name: Test
        run: uv run pytest
