# Runs automatically on `git commit` (after `uv run pre-commit install`).
# Run on everything manually with: uv run pre-commit run --all-files
repos:
  # Generic file hygiene checks, maintained by the pre-commit project.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict

  # Clear notebook outputs before committing: keeps diffs readable and keeps
  # scraped text and licensed data out of the public repo. Run locally to see them.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # ruff and mypy run from the project venv, i.e. the exact versions pinned in
  # uv.lock (same as CI). Calling .venv/bin directly, not `uv run`, keeps hooks
  # working from GUI git clients whose PATH lacks uv. Needs `uv sync` first.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types_or: [python, jupyter]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types_or: [python, jupyter]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy src tests
        language: system
        types: [python]
        pass_filenames: false
